<svg xmlns="http://www.w3.org/2000/svg" width="980" height="700" viewBox="0 0 980 700" role="img" aria-labelledby="title desc">
  <title id="title">Zara desktop rounded chat message preview</title>
  <desc id="desc">Signal Cabin desktop chat with rounded filled message bubbles replacing blue divider lines.</desc>
  <rect width="980" height="700" fill="#0A1012"/>

  <rect x="0" y="0" width="240" height="700" fill="#0D1518"/>
  <text x="24" y="42" fill="#F2E9D8" font-family="sans-serif" font-size="19" font-weight="700" letter-spacing="3">ZARA</text>
  <text x="24" y="72" fill="#A8B7B3" font-family="sans-serif" font-size="13">Conversations</text>
  <rect x="16" y="94" width="208" height="42" rx="10" fill="#0D1518" stroke="#2A393E"/>
  <text x="30" y="120" fill="#A8B7B3" font-family="sans-serif" font-size="13">Search chats</text>
  <rect x="16" y="154" width="208" height="45" rx="9" fill="#17382B"/>
  <text x="30" y="181" fill="#F2E9D8" font-family="sans-serif" font-size="14">Bubble redesign</text>
  <text x="30" y="225" fill="#A8B7B3" font-family="sans-serif" font-size="14">Qwen TTS setup</text>
  <text x="30" y="267" fill="#A8B7B3" font-family="sans-serif" font-size="14">StarLang work</text>

  <text x="272" y="48" fill="#F2E9D8" font-family="sans-serif" font-size="23" font-weight="700">Zara</text>
  <text x="777" y="48" fill="#A8B7B3" font-family="sans-serif" font-size="13">Provider: runtime default</text>
  <line x1="262" y1="66" x2="954" y2="66" stroke="#2A393E" stroke-width="1"/>

  <rect x="262" y="84" width="692" height="52" rx="10" fill="#111A1E" stroke="#2A393E"/>
  <circle cx="282" cy="110" r="4" fill="#61D095"/>
  <text x="296" y="114" fill="#61D095" font-family="monospace" font-size="11" font-weight="700">READY</text>
  <text x="365" y="114" fill="#A8B7B3" font-family="sans-serif" font-size="13">Zara is ready.</text>

  <rect x="278" y="166" width="660" height="98" rx="14" fill="#172226"/>
  <text x="294" y="190" fill="#61D095" font-family="monospace" font-size="11" font-weight="700">YOU</text>
  <text x="294" y="222" fill="#F2E9D8" font-family="sans-serif" font-size="15">The desktop chat should feel more like ChatGPT.</text>
  <text x="294" y="246" fill="#F2E9D8" font-family="sans-serif" font-size="15">Drop the blue dividers and use bubbles around each message.</text>

  <rect x="278" y="281" width="660" height="119" rx="14" fill="#111A1E"/>
  <text x="294" y="305" fill="#A8B7B3" font-family="monospace" font-size="11" font-weight="700">ZARA</text>
  <text x="294" y="338" fill="#F2E9D8" font-family="sans-serif" font-size="15">Yep — messages now sit inside rounded surfaces instead of</text>
  <text x="294" y="362" fill="#F2E9D8" font-family="sans-serif" font-size="15">being separated by accent-colored horizontal rules.</text>
  <text x="294" y="386" fill="#A8B7B3" font-family="sans-serif" font-size="13">The bubble colors follow the active theme palette.</text>

  <rect x="278" y="417" width="660" height="91" rx="14" fill="#172226"/>
  <text x="294" y="441" fill="#61D095" font-family="monospace" font-size="11" font-weight="700">YOU</text>
  <text x="294" y="475" fill="#F2E9D8" font-family="sans-serif" font-size="15">Much cleaner. Keep the same treatment across every theme.</text>

  <rect x="262" y="548" width="692" height="112" rx="15" fill="#172226" stroke="#3C5358"/>
  <text x="282" y="584" fill="#A8B7B3" font-family="sans-serif" font-size="14">Message Zara…</text>
  <rect x="898" y="564" width="40" height="40" rx="12" fill="#61D095"/>
  <path d="M918 575 L918 592 M911 582 L918 575 L925 582" fill="none" stroke="#0A1012" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
