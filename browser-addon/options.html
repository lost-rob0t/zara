<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Zara Browser Bridge</title>
  <style>
    body { font: 15px system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; }
    label { display: block; margin: 18px 0 6px; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; padding: 10px; font: inherit; }
    button { margin-top: 18px; padding: 10px 16px; font: inherit; }
    #status { margin-left: 10px; }
    code { word-break: break-all; }
  </style>
</head>
<body>
  <h1>Zara Browser Bridge</h1>
  <p>
    The add-on connects only to the local Zara bridge by default. Use the same
    secret stored in <code>ZARA_BROWSER_BRIDGE_TOKEN</code>.
  </p>

  <label for="bridge-url">Bridge WebSocket URL</label>
  <input id="bridge-url" value="ws://127.0.0.1:8765/v1/browser">

  <label for="token">Bridge token</label>
  <input id="token" type="password" autocomplete="off">

  <button id="save" type="button">Save</button>
  <span id="status" role="status"></span>

  <script src="options.js"></script>
</body>
</html>
