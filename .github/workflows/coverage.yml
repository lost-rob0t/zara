name: Coverage

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: python line + branch + total coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Fetch PR base
        if: github.event_name == 'pull_request'
        shell: bash
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Run branch-aware coverage gate
        shell: bash
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/artifacts/coverage
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            nix develop -c bash scripts/test-coverage.sh --base-ref "origin/${{ github.base_ref }}"
          else
            nix develop -c bash scripts/test-coverage.sh
          fi

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/coverage/
          if-no-files-found: error
