name: Local Cloud Integration

# A conflicted PR cannot start pull_request workflows. This branch-only diagnostic
# lane runs the existing gate; it does not replace CI or authorize a merge/release.
on:
  push:
    branches:
      - integrate/full-local-cloud-20260921
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-cloud-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ZARA_SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Check out exact feature source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Capture immutable integration source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ZARA_SOURCE_SHA"
          mkdir -p artifacts/local-cloud
          git rev-parse HEAD > artifacts/local-cloud/source-sha.txt
          git ls-tree -r HEAD > artifacts/local-cloud/source-blobs.txt
          git archive --format=zip --output=artifacts/local-cloud/source.zip HEAD
          base="$(git rev-parse origin/release/0.3.x)"
          ancestor="$(git merge-base HEAD "$base")"
          printf '%s\n' "$base" > artifacts/local-cloud/base-sha.txt
          printf '%s\n' "$ancestor" > artifacts/local-cloud/ancestor-sha.txt
          git archive --format=zip --output=artifacts/local-cloud/base.zip "$base"
          git archive --format=zip --output=artifacts/local-cloud/ancestor.zip "$ancestor"
          sha256sum artifacts/local-cloud/*.zip > artifacts/local-cloud/SHA256SUMS

      - name: Check local UI session API contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s t -p test_android_local_session_api_contract.py -v

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Run canonical Android gate
        shell: bash
        run: |
          set -euo pipefail
          nix develop ./android -c bash scripts/test-android.sh \
            2>&1 | tee artifacts/local-cloud/android-gate.log

      - name: Retain exact source and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-cloud-diagnostics-${{ github.sha }}
          path: |
            artifacts/local-cloud/
            android/**/build/test-results/
            android/**/build/reports/
          if-no-files-found: error
          retention-days: 7

      - name: Retain phone and LLM service debug APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: local-cloud-apks-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/llm-serve/build/outputs/apk/debug/llm-serve-debug.apk
          if-no-files-found: error
          retention-days: 7
