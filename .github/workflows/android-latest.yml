name: Android latest

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  actions: read
  contents: write

jobs:
  publish-android-latest:
    name: publish direct latest Android APKs
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact green master SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Download exact-SHA phone APK artifact
        uses: actions/download-artifact@v4
        with:
          name: zara-android-debug-${{ github.event.workflow_run.head_sha }}
          path: dist/phone
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Download exact-SHA Wear APK artifact
        uses: actions/download-artifact@v4
        with:
          name: zara-wear-debug-${{ github.event.workflow_run.head_sha }}
          path: dist/wear
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Prepare rolling direct-download assets
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/latest

          phone_apk="$(find dist/phone -type f -name 'zara-android-debug-*.apk' -print -quit)"
          wear_apk="$(find dist/wear -type f -name 'wear-app-debug.apk' -print -quit)"
          test -n "$phone_apk"
          test -n "$wear_apk"

          cp "$phone_apk" dist/latest/zara-latest.apk
          cp "$wear_apk" dist/latest/zara-wear-latest.apk
          sha256sum dist/latest/zara-latest.apk > dist/latest/zara-latest.apk.sha256
          sha256sum dist/latest/zara-wear-latest.apk > dist/latest/zara-wear-latest.apk.sha256

          phone_sha="$(sha256sum dist/latest/zara-latest.apk | awk '{print $1}')"
          wear_sha="$(sha256sum dist/latest/zara-wear-latest.apk | awk '{print $1}')"
          {
            echo "schema=1"
            echo "channel=android-latest"
            echo "mutable=true"
            echo "source_sha=${SOURCE_SHA}"
            echo "phone_apk=zara-latest.apk"
            echo "phone_sha256=${phone_sha}"
            echo "wear_apk=zara-wear-latest.apk"
            echo "wear_sha256=${wear_sha}"
          } > dist/latest/zara-latest.manifest.txt

      - name: Publish rolling android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          git tag -f android-latest "$SOURCE_SHA"
          git push --force origin refs/tags/android-latest

          notes="Rolling convenience build from the latest fully green master commit. This channel is intentionally mutable; use zara-latest.manifest.txt for the exact source SHA and checksums. Immutable SemVer releases remain under v* tags."

          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest dist/latest/* --clobber
            gh release edit android-latest \
              --title "Zara Android latest" \
              --prerelease \
              --notes "$notes"
          else
            gh release create android-latest dist/latest/* \
              --target "$SOURCE_SHA" \
              --title "Zara Android latest" \
              --prerelease \
              --notes "$notes"
          fi
