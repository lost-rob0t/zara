name: Zara Verifier Contract
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: zara-verifier-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verifier-contract:
    name: zara verifier contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Confirm exact candidate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: cachix/install-nix-action@v31
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm verifier PR base identity
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          snapshot="$(nix develop -c python verification/zara_verify_runner.py snapshot --root . --base "$EXPECTED_BASE_SHA")"
          SNAPSHOT_JSON="$snapshot" python - <<'PY'
          import json
          import os

          expected = os.environ['EXPECTED_BASE_SHA']
          observed = json.loads(os.environ['SNAPSHOT_JSON'])['source']['base']
          if observed != expected:
              raise SystemExit(f'verifier base mismatch: {observed} != {expected}')
          PY
      - name: Run runner, canonical expert registry, Prolog and OpenCode contracts
        run: nix develop -c bash scripts/test-zara-verify.sh
      - name: Upload verifier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zara-verify-${{ github.event.pull_request.head.sha || github.sha }}
          path: .artifacts/zara-verify
          if-no-files-found: error
          retention-days: 30
