name: Apply verified voice fleet repair once

on:
  push:
    branches: ['feat/voice-agent-fleet']
    paths: ['.voice-fleet-repair.patch']

permissions:
  contents: write

concurrency:
  group: voice-fleet-repair-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'lost-rob0t/zara' && github.ref == 'refs/heads/feat/voice-agent-fleet'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Apply digest-pinned repair to the feature branch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '3c6909fad2e296a6a9e83d3d570413eb624af7aa'
          python3 - <<'PY'
          import hashlib, pathlib, re, subprocess
          patch = pathlib.Path('.voice-fleet-repair.patch').read_bytes()
          if hashlib.sha256(patch).hexdigest() != 'eefc6ebf3881060c3a7e9631af243020b980e051580c61f5f518cf61a1c40f80':
              raise SystemExit('repair digest mismatch')
          paths = set(re.findall(r'^diff --git a/(\S+) b/\S+$', patch.decode(), re.M))
          if paths != {'zara/tasks/runner.py', 't/test_task_observability.py', 't/test_voice_agent_host.py'}:
              raise SystemExit('repair path mismatch')
          subprocess.run(['git', 'apply', '--index', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          PY
          python3 -m compileall -q zara t/test_voice_agent_host.py
          git diff --cached --check
          git rm .voice-fleet-repair.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(voice): deduplicate approval cancellation and exercise full host fleet flow'
          git push origin HEAD:refs/heads/feat/voice-agent-fleet
