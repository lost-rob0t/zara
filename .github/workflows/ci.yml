name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whitespace errors
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if [ -n "${{ github.base_ref }}" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^..HEAD
          fi

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Run all tests
        run: nix develop -c bash scripts/test-all.sh

      - name: Run flake checks
        run: nix flake check

      - name: Build packaged Zara
        run: nix build

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-artifacts
          path: artifacts/
          if-no-files-found: warn

  shared-mic:
    name: shared mic / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            python: python3
          - name: Arch Linux
            image: archlinux:latest
            python: python

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Install distro audio stack
        shell: bash
        run: |
          set -euxo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends \
              ca-certificates \
              git \
              build-essential \
              libffi-dev \
              libportaudio2 \
              portaudio19-dev \
              pulseaudio \
              pulseaudio-utils \
              python3 \
              python3-pip \
              python3-venv
          else
            pacman -Syu --noconfirm \
              base-devel \
              ca-certificates \
              git \
              libffi \
              portaudio \
              pulseaudio \
              python \
              python-pip
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Python audio dependencies
        shell: bash
        run: |
          set -euxo pipefail
          ${{ matrix.python }} -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --upgrade pip
          .venv/bin/python -m pip install --disable-pip-version-check numpy sounddevice pytest

      - name: Run audio unit tests
        shell: bash
        run: |
          set -euxo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          .venv/bin/python -m pytest -q t/test_audio_shared_input.py

      - name: Run Discord-style concurrent capture probe
        shell: bash
        run: |
          set -euxo pipefail
          id zara >/dev/null 2>&1 || useradd --create-home --shell /bin/bash zara
          chown -R zara:zara "$GITHUB_WORKSPACE"
          su zara -s /bin/bash -c "cd '$GITHUB_WORKSPACE' && HOME=/home/zara RUNNER_TEMP=/tmp PATH='$GITHUB_WORKSPACE/.venv/bin':\$PATH bash scripts/test-linux-shared-audio.sh"

  android:
    name: android skeleton gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Run Android gate (unit tests + native Trealla + debug APK + secret inspection)
        run: nix develop ./android -c bash scripts/test-android.sh

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zara-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
