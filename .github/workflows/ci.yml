name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact source checkout
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$SOURCE_SHA" || {
            echo "checkout/source mismatch: expected=$SOURCE_SHA actual=$actual" >&2
            exit 1
          }

      - name: Check whitespace errors
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if [ -n "${{ github.base_ref }}" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^..HEAD
          fi

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Run all tests
        run: nix develop -c bash scripts/test-all.sh

      - name: Run formal AGENTIC-15 verification
        run: |
          nix develop -c swipl -q \
            -s verification/agentic_fleet_verify.pl \
            -g "(agentic_fleet_verify:verify -> halt(0); halt(1))" \
            -t "halt(1)"
          nix develop -c swipl -q \
            -s t/agentic_fleet_verify.pl \
            -g "(run_tests -> halt(0); halt(1))" \
            -t "halt(1)"

      - name: Run flake checks
        run: nix flake check

      - name: Build packaged Zara
        run: nix build

      - name: Render deterministic Copilot screenshots
        env:
          QT_QPA_PLATFORM: offscreen
          ZARA_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          nix develop -c python - <<'PY'
          import os
          from pathlib import Path

          from zara.desktop.ui_fixtures import render_copilot_fixtures

          render_copilot_fixtures(
              Path(os.environ["ARTIFACT_DIR"]) / "ui",
              source_commit=os.environ["ZARA_SOURCE_COMMIT"],
          )
          PY

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-artifacts
          path: artifacts/
          if-no-files-found: warn

  deep-regression:
    name: deep regression / hash seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        seed:
          - "1"
          - "31337"
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
      PYTHONASYNCIODEBUG: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Run full Python suite under adversarial runtime settings
        run: nix develop -c python -m pytest -q -o faulthandler_timeout=15 t/

  shared-mic:
    name: shared mic / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            python: python3
          - name: Arch Linux
            image: ghcr.io/archlinux/archlinux:latest
            python: python

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Install distro audio stack
        shell: bash
        run: |
          set -euxo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends \
              ca-certificates \
              git \
              build-essential \
              libffi-dev \
              libportaudio2 \
              portaudio19-dev \
              pulseaudio \
              pulseaudio-utils \
              python3 \
              python3-pip \
              python3-venv
          else
            pacman -Syu --noconfirm \
              base-devel \
              ca-certificates \
              git \
              libffi \
              portaudio \
              pulseaudio \
              python \
              python-pip
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Python audio dependencies
        shell: bash
        run: |
          set -euxo pipefail
          ${{ matrix.python }} -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --upgrade pip
          .venv/bin/python -m pip install --disable-pip-version-check numpy sounddevice pytest

      - name: Run audio unit tests
        shell: bash
        run: |
          set -euxo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          .venv/bin/python -m pytest -q t/test_audio_shared_input.py

      - name: Run Discord-style concurrent capture probe
        shell: bash
        run: |
          set -euxo pipefail
          id zara >/dev/null 2>&1 || useradd --create-home --shell /bin/bash zara
          chown -R zara:zara "$GITHUB_WORKSPACE"
          su zara -s /bin/bash -c "cd '$GITHUB_WORKSPACE' && HOME=/home/zara RUNNER_TEMP=/tmp PATH='$GITHUB_WORKSPACE/.venv/bin':\$PATH bash scripts/test-linux-shared-audio.sh"

  android:
    name: android + wear gate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact source checkout
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$SOURCE_SHA" || {
            echo "checkout/source mismatch: expected=$SOURCE_SHA actual=$actual" >&2
            exit 1
          }

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Load update-compatible Android signing key for rolling master builds
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        env:
          ZARA_ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ZARA_ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ZARA_ANDROID_DEBUG_KEYSTORE_B64" ]]; then
            echo "Zara Android signing secret is unavailable." >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/zara-android-debug.keystore"
          printf '%s' "$ZARA_ANDROID_DEBUG_KEYSTORE_B64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "ZARA_ANDROID_DEBUG_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Run Android/Wear gate (unit tests + native Trealla + debug APKs + secret inspection)
        run: nix develop ./android -c bash scripts/test-android.sh

      - name: Upload Android parity diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-semantic-parity-diagnostics
          path: android/app/build/reports/semantic-parity/
          if-no-files-found: warn

      - name: Enable KVM access for emulator acceptance
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android emulator host runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          apt-cache policy libpulse0
          sudo apt-get install -y --no-install-recommends libpulse0
          ldconfig -p | grep -F 'libpulse.so.0' >/dev/null || {
            echo "required emulator host library libpulse.so.0 is unavailable" >&2
            exit 1
          }

      - name: Prime Android emulator SDK with current command-line tools
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?ANDROID SDK root is unavailable}}"
          emulator_bin="$sdk_root/emulator/emulator"
          android_cache="${HOME:?HOME is unavailable}/.android/cache"
          android_cli_tools_build="15859902"
          android_cli_tools_sha256="4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583"
          android_cli_tools_archive="commandlinetools-linux-${android_cli_tools_build}_latest.zip"
          android_cli_tools_url="https://dl.google.com/android/repository/${android_cli_tools_archive}"
          android_cli_tools_tmp="$(mktemp -d)"
          trap 'rm -rf "$android_cli_tools_tmp"' EXIT

          curl --fail --location --retry 3 --retry-delay 2 \
            "$android_cli_tools_url" \
            --output "$android_cli_tools_tmp/$android_cli_tools_archive"
          printf '%s  %s\n' \
            "$android_cli_tools_sha256" \
            "$android_cli_tools_tmp/$android_cli_tools_archive" \
            | sha256sum --check
          unzip -q \
            "$android_cli_tools_tmp/$android_cli_tools_archive" \
            -d "$android_cli_tools_tmp/unpacked"

          rm -rf "$sdk_root/cmdline-tools/latest"
          mkdir -p "$sdk_root/cmdline-tools/latest"
          cp -R \
            "$android_cli_tools_tmp/unpacked/cmdline-tools/." \
            "$sdk_root/cmdline-tools/latest/"

          sdkmanager_bin="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_bin" || {
            echo "current sdkmanager install is unavailable: $sdkmanager_bin" >&2
            exit 1
          }
          "$sdkmanager_bin" --version

          if test -x "$emulator_bin" && "$emulator_bin" -version; then
            echo "host Android emulator SDK is already healthy"
            exit 0
          fi

          for attempt in 1 2 3; do
            echo "emulator SDK install attempt ${attempt}/3"
            rm -rf "$sdk_root/emulator" "$sdk_root/.temp" "$sdk_root/.downloadIntermediates" "$android_cache"
            if "$sdkmanager_bin" --sdk_root="$sdk_root" --install platform-tools --channel=0 \
              && "$sdkmanager_bin" --sdk_root="$sdk_root" --install emulator --channel=0 \
              && test -x "$emulator_bin" \
              && "$emulator_bin" -version; then
              exit 0
            fi
            echo "emulator SDK install failed or verification failed; clearing package state" >&2
            rm -rf "$sdk_root/emulator" "$sdk_root/.temp" "$sdk_root/.downloadIntermediates" "$android_cache"
            sleep "$((attempt * 2))"
          done
          echo "emulator SDK install failed after 3 attempts" >&2
          exit 1

      - name: Capture Android screenshot evidence and verify Zara Code install
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            serial="emulator-5554"
            bash scripts/test-android-emulator-install.sh "$serial" "$SOURCE_SHA"

      - name: Upload Android UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-evidence
          path: android/app/build/reports/device/
          if-no-files-found: error

      - name: Prepare exact-SHA phone APK artifact
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          artifact_dir="artifacts/android-debug"
          apk="$artifact_dir/zara-android-debug-${SOURCE_SHA}.apk"
          mkdir -p "$artifact_dir"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$apk"
          sha256sum "$apk" > "${apk}.sha256"
          {
            echo "schema=1"
            echo "source_sha=${SOURCE_SHA}"
            echo "apk=$(basename "$apk")"
            echo "apk_sha256=$(sha256sum "$apk" | awk '{print $1}')"
          } > "$artifact_dir/manifest.txt"

      - name: Upload exact-SHA phone debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zara-android-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/android-debug/
          if-no-files-found: warn

      - name: Upload Code Editor debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zara-code-editor-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: android/code-editor/build/outputs/apk/debug/code-editor-debug.apk
          if-no-files-found: warn

      - name: Upload LLM Serve debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zara-llm-serve-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: android/llm-serve/build/outputs/apk/debug/llm-serve-debug.apk
          if-no-files-found: warn

      - name: Upload Wear debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zara-wear-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: android/wear-app/build/outputs/apk/debug/wear-app-debug.apk
          if-no-files-found: warn

  evidence:
    name: dual-surface screenshot evidence
    needs:
      - test
      - android
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download desktop screenshot evidence
        uses: actions/download-artifact@v4
        with:
          name: regression-artifacts
          path: evidence/desktop

      - name: Download Android screenshot evidence
        uses: actions/download-artifact@v4
        with:
          name: android-ui-evidence
          path: evidence/android

      - name: Validate dual-surface screenshot evidence
        run: |
          python scripts/validate-ui-evidence.py \
            --source-sha "$SOURCE_SHA" \
            --desktop evidence/desktop/ui/manifest.json \
            --android evidence/android/manifest.json

  agentic-gate:
    name: agentic formal + live app gate
    needs:
      - test
      - android
      - evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Re-run formal proof after live-app gates
        run: |
          nix develop -c swipl -q \
            -s verification/agentic_fleet_verify.pl \
            -g "(agentic_fleet_verify:verify -> halt(0); halt(1))" \
            -t "halt(1)"
          echo "AGENTIC-15 formal proof + exact-APK Android automation + dual-surface evidence passed."
