name: Promote Release Tag

on:
  push:
    branches:
      - master
    paths:
      - version.properties

permissions:
  contents: write

jobs:
  promote-tag:
    name: create immutable release tag
    runs-on: ubuntu-latest

    steps:
      - name: Check out exact promoted source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve canonical version context
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python scripts/version-context.py --format github-output >> "$GITHUB_OUTPUT"

      - name: Create immutable release tag when promoted
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_READY: ${{ steps.version.outputs.release_ready }}
        run: |
          set -euo pipefail

          if [[ "$RELEASE_READY" != "true" ]]; then
            echo "Source is not promoted to the release target; no tag created."
            exit 0
          fi

          tag="v$VERSION"
          existing="$(git ls-remote --tags origin "refs/tags/$tag" | awk 'NR == 1 {print $1}')"
          if [[ -n "$existing" ]]; then
            if [[ "$existing" == "$GITHUB_SHA" ]]; then
              echo "$tag already points at this exact source."
              exit 0
            fi
            echo "Refusing to move existing immutable tag $tag ($existing != $GITHUB_SHA)." >&2
            exit 1
          fi

          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
