      - name: Verify staged release bytes, metadata, signer, and notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-version-context.outputs.tag }}
          VERSION: ${{ needs.validate-version-context.outputs.version }}
          VERSION_CODE: ${{ needs.validate-version-context.outputs.version_code }}
          APK: ${{ steps.artifact.outputs.apk }}
          MANIFEST: ${{ steps.artifact.outputs.manifest }}
          CODE_EDITOR_APK: ${{ steps.artifact.outputs.code_editor_apk }}
          CODE_EDITOR_MANIFEST: ${{ steps.artifact.outputs.code_editor_manifest }}
          NOTES: ${{ steps.notes.outputs.notes }}
          STAGED_RELEASE_ID: ${{ steps.stage.outputs.release_id }}
          STAGED_TITLE: "Zara ${{ needs.validate-version-context.outputs.tag }} [zara-staging:${{ github.repository }}:${{ github.sha }}:run=${{ github.run_id }}:attempt=${{ github.run_attempt }}]"
