name: Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths:
      - android/app/build.gradle.kts

permissions:
  contents: write

jobs:
  android-alpha-release:
    name: build and publish Android alpha
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' android/app/build.gradle.kts)"
          if [[ -z "$version" ]]; then
            echo "Could not resolve Android versionName." >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Android versionName is not SemVer: $version" >&2
            exit 1
          fi
          version_code="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' android/app/build.gradle.kts)"
          if [[ -z "$version_code" || "$version_code" -lt 1 ]]; then
            echo "Could not resolve a positive Android versionCode." >&2
            exit 1
          fi

          store_version="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' android/apps/zara-store/build.gradle.kts)"
          if [[ -z "$store_version" ]]; then
            echo "Could not resolve Zara Store versionName." >&2
            exit 1
          fi
          if [[ ! "$store_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Zara Store versionName is not SemVer: $store_version" >&2
            exit 1
          fi
          store_version_code="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' android/apps/zara-store/build.gradle.kts)"
          if [[ -z "$store_version_code" || "$store_version_code" -lt 1 ]]; then
            echo "Could not resolve a positive Zara Store versionCode." >&2
            exit 1
          fi

          tag="v${version}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "$tag" ]]; then
            echo "Tag/version mismatch: ref=${GITHUB_REF_NAME}, app=${tag}" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "store_version=$store_version" >> "$GITHUB_OUTPUT"
          echo "store_version_code=$store_version_code" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Load update-compatible Android signing key
        shell: bash
        env:
          ZARA_ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ZARA_ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ZARA_ANDROID_DEBUG_KEYSTORE_B64" ]]; then
            echo "Zara Android signing secret is unavailable." >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/zara-android-debug.keystore"
          printf '%s' "$ZARA_ANDROID_DEBUG_KEYSTORE_B64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "ZARA_ANDROID_DEBUG_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Run Android release gate
        run: nix develop ./android -c bash scripts/test-android-release.sh

      - name: Prepare APKs and checksums
        id: artifact
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
          STORE_VERSION: ${{ steps.release.outputs.store_version }}
          STORE_VERSION_CODE: ${{ steps.release.outputs.store_version_code }}
        run: |
          set -euo pipefail
          mkdir -p dist

          apk="dist/zara-android-${VERSION}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$apk"
          sha256sum "$apk" > "${apk}.sha256"
          {
            echo "schema=1"
            echo "source_sha=${GITHUB_SHA}"
            echo "package_name=ai.zara.app"
            echo "version_name=${VERSION}"
            echo "version_code=${VERSION_CODE}"
            echo "apk=$(basename "$apk")"
            echo "apk_sha256=$(sha256sum "$apk" | awk '{print $1}')"
          } > "dist/zara-android-${VERSION}.manifest.txt"

          store_apk="dist/zara-store-${STORE_VERSION}.apk"
          cp android/apps/zara-store/build/outputs/apk/debug/zara-store-debug.apk "$store_apk"
          sha256sum "$store_apk" > "${store_apk}.sha256"
          {
            echo "schema=1"
            echo "source_sha=${GITHUB_SHA}"
            echo "package_name=ai.zara.store"
            echo "version_name=${STORE_VERSION}"
            echo "version_code=${STORE_VERSION_CODE}"
            echo "release_status=experimental"
            echo "apk=$(basename "$store_apk")"
            echo "apk_sha256=$(sha256sum "$store_apk" | awk '{print $1}')"
          } > "dist/zara-store-${STORE_VERSION}.manifest.txt"

          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "manifest=dist/zara-android-${VERSION}.manifest.txt" >> "$GITHUB_OUTPUT"
          echo "store_apk=$store_apk" >> "$GITHUB_OUTPUT"
          echo "store_manifest=dist/zara-store-${STORE_VERSION}.manifest.txt" >> "$GITHUB_OUTPUT"

      - name: Verify update-compatible Android signing certificate
        env:
          APK: ${{ steps.artifact.outputs.apk }}
        run: nix develop ./android -c bash scripts/check-android-apk-signer.sh "$APK"

      - name: Verify update-compatible Zara Store signing certificate
        env:
          STORE_APK: ${{ steps.artifact.outputs.store_apk }}
        run: nix develop ./android -c bash scripts/check-android-apk-signer.sh "$STORE_APK"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          STORE_VERSION: ${{ steps.release.outputs.store_version }}
          APK: ${{ steps.artifact.outputs.apk }}
          MANIFEST: ${{ steps.artifact.outputs.manifest }}
          STORE_APK: ${{ steps.artifact.outputs.store_apk }}
          STORE_MANIFEST: ${{ steps.artifact.outputs.store_manifest }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi

          gh release create "$TAG" \
            "$APK" \
            "${APK}.sha256" \
            "$MANIFEST" \
            "$STORE_APK" \
            "${STORE_APK}.sha256" \
            "$STORE_MANIFEST" \
            --target "$GITHUB_SHA" \
            --title "Zara $TAG" \
            --prerelease \
            --notes "Android alpha preview of Zara plus Zara Store ${STORE_VERSION} (experimental foundation). These are debug-signed APKs intended for direct sideloading/testing, not production Play Store builds. Zara Store does not yet enable repository trust promotion or APK installation. Requires Android 10 (API 29) or newer. Verify each APK with its accompanying SHA-256 and provenance manifest. Source commit: $GITHUB_SHA"
