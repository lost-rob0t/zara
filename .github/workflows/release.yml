name: Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths:
      - version.properties
      - zara/version_context.py
      - scripts/version-context.py
      - setup.py
      - android/app/build.gradle.kts
      - android/code-editor/build.gradle.kts
      - android/org-app/build.gradle.kts
      - android/org-editor/build.gradle.kts
      - android/org-todo/build.gradle.kts
      - android/org-reminder/build.gradle.kts
      - android/org-timer/build.gradle.kts
      - android/org-roam/build.gradle.kts
      - android/org-graph/build.gradle.kts
      - android/org-home/build.gradle.kts
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  validate-version-context:
    name: validate strict version context
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      version_code: ${{ steps.release.outputs.version_code }}
      tag: ${{ steps.release.outputs.tag }}
      release_ready: ${{ steps.release.outputs.release_ready }}
      publish_needed: ${{ steps.release.outputs.publish_needed }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve canonical version context
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python scripts/version-context.py --format github-output >> "$GITHUB_OUTPUT"

          context="$(python scripts/version-context.py --format json)"
          version="$(printf '%s' "$context" | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          release_ready="$(printf '%s' "$context" | python -c 'import json,sys; print(str(json.load(sys.stdin)["release_ready"]).lower())')"
          tag="v${version}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "$tag" ]]; then
            echo "Tag/version mismatch: ref=${GITHUB_REF_NAME}, product=$tag" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "$release_ready" != "true" ]]; then
            echo "Release tag refused: current source is not promoted to release.target" >&2
            exit 1
          fi

          publish_needed=false
          if [[ "${GITHUB_REF}" == "refs/heads/master" && "$release_ready" == "true" ]]; then
            if ! gh release view "$tag" >/dev/null 2>&1; then
              publish_needed=true
            fi
          fi
          echo "publish_needed=$publish_needed" >> "$GITHUB_OUTPUT"

  android-alpha-release:
    name: build and publish Android alpha
    if: >-
      github.ref_type == 'tag' ||
      (github.ref == 'refs/heads/master' &&
       needs.validate-version-context.outputs.release_ready == 'true' &&
       needs.validate-version-context.outputs.publish_needed == 'true')
    needs:
      - validate-version-context
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Load update-compatible Android signing key
        shell: bash
        env:
          ZARA_ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ZARA_ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ZARA_ANDROID_DEBUG_KEYSTORE_B64" ]]; then
            echo "Zara Android signing secret is unavailable." >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/zara-android-debug.keystore"
          printf '%s' "$ZARA_ANDROID_DEBUG_KEYSTORE_B64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "ZARA_ANDROID_DEBUG_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Run Android release gate
        run: nix develop ./android -c bash scripts/test-android-release.sh

      - name: Prepare APK and checksum
        id: artifact
        shell: bash
        env:
          VERSION: ${{ needs.validate-version-context.outputs.version }}
          VERSION_CODE: ${{ needs.validate-version-context.outputs.version_code }}
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="dist/zara-android-${VERSION}.apk"
          code_editor_apk="dist/zara-code-editor-${VERSION}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$apk"
          cp android/code-editor/build/outputs/apk/debug/code-editor-debug.apk "$code_editor_apk"
          sha256sum "$apk" > "${apk}.sha256"
          sha256sum "$code_editor_apk" > "${code_editor_apk}.sha256"
          {
            echo "schema=1"
            echo "source_sha=${GITHUB_SHA}"
            echo "version_name=${VERSION}"
            echo "version_code=${VERSION_CODE}"
            echo "apk=$(basename "$apk")"
            echo "apk_sha256=$(sha256sum "$apk" | awk '{print $1}')"
          } > "dist/zara-android-${VERSION}.manifest.txt"
          {
            echo "schema=1"
            echo "source_sha=${GITHUB_SHA}"
            echo "version_name=${VERSION}"
            echo "version_code=${VERSION_CODE}"
            echo "apk=$(basename "$code_editor_apk")"
            echo "apk_sha256=$(sha256sum "$code_editor_apk" | awk '{print $1}')"
          } > "dist/zara-code-editor-${VERSION}.manifest.txt"

          org_modules=("org-app" "org-editor" "org-todo" "org-reminder" "org-timer" "org-roam" "org-graph" "org-home")
          org_application_ids=("ai.zara.org.app" "ai.zara.org.editor" "ai.zara.org.todo" "ai.zara.org.reminder" "ai.zara.org.timer" "ai.zara.org.roam" "ai.zara.org.graph" "ai.zara.org.home")
          for index in "${!org_modules[@]}"; do
            module="${org_modules[$index]}"
            application_id="${org_application_ids[$index]}"
            org_apk="dist/zara-${module}-${VERSION}.apk"
            cp "android/${module}/build/outputs/apk/debug/${module}-debug.apk" "$org_apk"
            sha256sum "$org_apk" > "${org_apk}.sha256"
            {
              echo "schema=1"
              echo "source_sha=${GITHUB_SHA}"
              echo "version_name=${VERSION}"
              echo "version_code=${VERSION_CODE}"
              echo "application_id=${application_id}"
              echo "apk=$(basename "$org_apk")"
              echo "apk_sha256=$(sha256sum "$org_apk" | awk '{print $1}')"
            } > "dist/zara-${module}-${VERSION}.manifest.txt"
          done

          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "manifest=dist/zara-android-${VERSION}.manifest.txt" >> "$GITHUB_OUTPUT"
          echo "code_editor_apk=$code_editor_apk" >> "$GITHUB_OUTPUT"
          echo "code_editor_manifest=dist/zara-code-editor-${VERSION}.manifest.txt" >> "$GITHUB_OUTPUT"

      - name: Verify update-compatible Android signing certificates
        env:
          APK: ${{ steps.artifact.outputs.apk }}
          CODE_EDITOR_APK: ${{ steps.artifact.outputs.code_editor_apk }}
        run: |
          nix develop ./android -c bash scripts/check-android-apk-signer.sh "$APK"
          nix develop ./android -c bash scripts/check-android-apk-signer.sh "$CODE_EDITOR_APK"
          for org_apk in dist/zara-org-*-*.apk; do
            case "$org_apk" in *.sha256) continue ;; esac
            nix develop ./android -c bash scripts/check-android-apk-signer.sh "$org_apk"
          done

      - name: Verify fleet APKs are installable under their own identities
        run: |
          for entry in dist/zara-org-*-*.manifest.txt; do
            application_id="$(sed -n 's/^application_id=//p' "$entry")"
            apk_name="$(sed -n 's/^apk=//p' "$entry")"
            nix develop ./android -c bash scripts/check-android-apk-installable.sh "dist/$apk_name" "$application_id"
          done

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-version-context.outputs.tag }}
          VERSION: ${{ needs.validate-version-context.outputs.version }}
          VERSION_CODE: ${{ needs.validate-version-context.outputs.version_code }}
          APK: ${{ steps.artifact.outputs.apk }}
          MANIFEST: ${{ steps.artifact.outputs.manifest }}
          CODE_EDITOR_APK: ${{ steps.artifact.outputs.code_editor_apk }}
          CODE_EDITOR_MANIFEST: ${{ steps.artifact.outputs.code_editor_manifest }}
        shell: bash
        run: |
          set -euo pipefail

          org_modules=("org-app" "org-editor" "org-todo" "org-reminder" "org-timer" "org-roam" "org-graph" "org-home")
          org_assets=()
          for module in "${org_modules[@]}"; do
            org_assets+=("dist/zara-${module}-${VERSION}.apk" "dist/zara-${module}-${VERSION}.apk.sha256" "dist/zara-${module}-${VERSION}.manifest.txt")
          done

          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "${GITHUB_REF_TYPE}" == "branch" ]]; then
              existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq '.sha')"
              if [[ "$existing_sha" != "$GITHUB_SHA" ]]; then
                echo "Release $TAG already exists at $existing_sha; expected promoted source $GITHUB_SHA." >&2
                exit 1
              fi

              assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
              for required in \
                "$(basename "$APK")" \
                "$(basename "${APK}.sha256")" \
                "$(basename "$MANIFEST")" \
                "$(basename "$CODE_EDITOR_APK")" \
                "$(basename "${CODE_EDITOR_APK}.sha256")" \
                "$(basename "$CODE_EDITOR_MANIFEST")" \
                "${org_assets[@]##*/}"
              do
                if ! grep -Fxq "$required" <<< "$assets"; then
                  echo "Release $TAG is missing required asset $required." >&2
                  exit 1
                fi
              done

              existing_dir="$RUNNER_TEMP/existing-release-${TAG}"
              mkdir -p "$existing_dir"
              gh release download "$TAG" \
                --dir "$existing_dir" \
                --pattern "*.manifest.txt"
              for manifest_entry in \
                "$(basename "$MANIFEST")" \
                "$(basename "$CODE_EDITOR_MANIFEST")" \
                "${org_assets[@]##*/}"; do
                case "$manifest_entry" in *.manifest.txt) ;; *) continue ;; esac
                existing_manifest="$existing_dir/$manifest_entry"
                grep -Fxq "source_sha=${GITHUB_SHA}" "$existing_manifest" || {
                  echo "Release $TAG manifest $manifest_entry source_sha does not match $GITHUB_SHA." >&2
                  exit 1
                }
                grep -Fxq "version_name=${VERSION}" "$existing_manifest" || {
                  echo "Release $TAG manifest $manifest_entry version_name does not match $VERSION." >&2
                  exit 1
                }
                grep -Fxq "version_code=${VERSION_CODE}" "$existing_manifest" || {
                  echo "Release $TAG manifest $manifest_entry version_code does not match $VERSION_CODE." >&2
                  exit 1
                }
              done

              echo "Release $TAG already exists and matches canonical promotion $GITHUB_SHA."
              exit 0
            fi
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/${TAG}^{commit}" >/dev/null; then
            existing_tag_sha="$(git rev-list -n 1 "$TAG")"
            if [[ "$existing_tag_sha" != "$GITHUB_SHA" ]]; then
              echo "Tag $TAG already exists at $existing_tag_sha; expected release source $GITHUB_SHA." >&2
              exit 1
            fi
          fi

          gh release create "$TAG" \
            "$APK" \
            "${APK}.sha256" \
            "$MANIFEST" \
            "$CODE_EDITOR_APK" \
            "${CODE_EDITOR_APK}.sha256" \
            "$CODE_EDITOR_MANIFEST" \
            "${org_assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "Zara $TAG" \
            --notes "Zara Android alpha preview plus the Org app fleet: one installable APK per Org app system (Org flagship, Editor, Todo, Reminder, Timer, Roam, Graph, Home). Every Org app works standalone over ordinary Org files and needs none of the others installed. These are debug-signed APKs intended for direct sideloading/testing, not production Play Store builds. Requires Android 10 (API 29) or newer. Verify each APK with its accompanying SHA-256 file and provenance manifest. Source commit: $GITHUB_SHA"
