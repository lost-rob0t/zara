name: Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths:
      - android/app/build.gradle.kts

permissions:
  contents: write

jobs:
  android-alpha-release:
    name: build and publish Android alpha
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' android/app/build.gradle.kts)"
          if [[ -z "$version" ]]; then
            echo "Could not resolve Android versionName." >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Android versionName is not SemVer: $version" >&2
            exit 1
          fi
          version_code="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' android/app/build.gradle.kts)"
          if [[ -z "$version_code" || "$version_code" -lt 1 ]]; then
            echo "Could not resolve a positive Android versionCode." >&2
            exit 1
          fi

          tag="v${version}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "$tag" ]]; then
            echo "Tag/version mismatch: ref=${GITHUB_REF_NAME}, app=${tag}" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Load update-compatible Android signing key
        shell: bash
        env:
          ZARA_ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ZARA_ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ZARA_ANDROID_DEBUG_KEYSTORE_B64" ]]; then
            echo "Zara Android signing secret is unavailable." >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/zara-android-debug.keystore"
          printf '%s' "$ZARA_ANDROID_DEBUG_KEYSTORE_B64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "ZARA_ANDROID_DEBUG_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Run Android release gate
        run: nix develop ./android -c bash scripts/test-android-release.sh

      - name: Prepare APK and checksum
        id: artifact
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="dist/zara-android-${VERSION}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$apk"
          sha256sum "$apk" > "${apk}.sha256"
          {
            echo "schema=1"
            echo "source_sha=${GITHUB_SHA}"
            echo "version_name=${VERSION}"
            echo "version_code=${VERSION_CODE}"
            echo "apk=$(basename "$apk")"
            echo "apk_sha256=$(sha256sum "$apk" | awk '{print $1}')"
          } > "dist/zara-android-${VERSION}.manifest.txt"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "manifest=dist/zara-android-${VERSION}.manifest.txt" >> "$GITHUB_OUTPUT"

      - name: Verify update-compatible Android signing certificate
        env:
          APK: ${{ steps.artifact.outputs.apk }}
        run: nix develop ./android -c bash scripts/check-android-apk-signer.sh "$APK"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          APK: ${{ steps.artifact.outputs.apk }}
          MANIFEST: ${{ steps.artifact.outputs.manifest }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi

          gh release create "$TAG" \
            "$APK" \
            "${APK}.sha256" \
            "$MANIFEST" \
            --target "$GITHUB_SHA" \
            --title "Zara $TAG" \
            --prerelease \
            --notes "Android alpha preview of Zara. This is a debug-signed APK intended for direct sideloading/testing, not a production Play Store build. Requires Android 10 (API 29) or newer. Verify the APK with the accompanying SHA-256 file. Source commit: $GITHUB_SHA"
