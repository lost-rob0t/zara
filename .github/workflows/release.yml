          grep -Fxq "version_code=${VERSION_CODE}" "$staged_code_editor_manifest"
          grep -Fxq "apk=$(basename "$staged_code_editor_apk")" "$staged_code_editor_manifest"
          grep -Fxq "apk_sha256=${actual_code_editor_sha}" "$staged_code_editor_manifest"

