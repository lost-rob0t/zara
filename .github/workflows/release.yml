          staged_pages="$RUNNER_TEMP/releases-staged-${TAG}.json"
          staged_id_file="$RUNNER_TEMP/releases-staged-${TAG}.id"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            > "$staged_pages"
          RELEASE_TAG="$TAG" STAGED_TITLE="$STAGED_TITLE" \
