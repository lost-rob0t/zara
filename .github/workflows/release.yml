name: Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths:
      - version.properties
      - zara/version_context.py
      - scripts/version-context.py
      - setup.py
      - android/app/build.gradle.kts
      - android/code-editor/build.gradle.kts
      - android/wear-app/build.gradle.kts
      - .github/workflows/release.yml
      - scripts/release-changelog.py

permissions:
  actions: read
  contents: write

jobs:
  validate-version-context:
    name: validate strict version context
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      version_code: ${{ steps.release.outputs.version_code }}
      tag: ${{ steps.release.outputs.tag }}
      release_ready: ${{ steps.release.outputs.release_ready }}
      publish_needed: ${{ steps.release.outputs.publish_needed }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve canonical version context
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python scripts/version-context.py --format github-output >> "$GITHUB_OUTPUT"

          context="$(python scripts/version-context.py --format json)"
          version="$(printf '%s' "$context" | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          release_ready="$(printf '%s' "$context" | python -c 'import json,sys; print(str(json.load(sys.stdin)["release_ready"]).lower())')"
          tag="v${version}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "$tag" ]]; then
            echo "Tag/version mismatch: ref=${GITHUB_REF_NAME}, product=$tag" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "$release_ready" != "true" ]]; then
            echo "Release tag refused: current source is not promoted to release.target" >&2
            exit 1
          fi

          publish_needed=false
          if [[ "${GITHUB_REF}" == "refs/heads/master" && "$release_ready" == "true" ]]; then
            if ! gh release view "$tag" >/dev/null 2>&1; then
              publish_needed=true
            fi
          fi
          echo "publish_needed=$publish_needed" >> "$GITHUB_OUTPUT"

      - name: Validate canonical release notes
        if: steps.release.outputs.release_ready == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          NOTES: ${{ runner.temp }}/canonical-release-notes.md
        run: |
          set -euo pipefail
          python scripts/release-changelog.py --version "$VERSION" --output "$NOTES"

  sync-existing-release-notes:
    name: sync existing release page from tagged changelog
    if: >-
      github.ref == 'refs/heads/master' &&
      needs.validate-version-context.outputs.release_ready == 'true' &&
      needs.validate-version-context.outputs.publish_needed == 'false'
    needs:
      - validate-version-context
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync GitHub release notes from the exact tagged changelog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-version-context.outputs.tag }}
          VERSION: ${{ needs.validate-version-context.outputs.version }}
        run: |
          set -euo pipefail

          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" --force
          tag_sha="$(git rev-list -n 1 "$TAG")"
          test -n "$tag_sha"

          tagged_changelog="$RUNNER_TEMP/${TAG}-CHANGELOG.md"
          notes="$RUNNER_TEMP/${TAG}-release-notes.md"
          git show "${TAG}:CHANGELOG.md" > "$tagged_changelog"
          python scripts/release-changelog.py \
            --version "$VERSION" \
            --changelog "$tagged_changelog" \
            --output "$notes"

          current="$RUNNER_TEMP/${TAG}-current-release-body.md"
          gh release view "$TAG" --json body --jq '.body' > "$current"
          if ! diff -u "$notes" "$current"; then
            gh release edit "$TAG" --notes-file "$notes"
            echo "Synced $TAG release page from tagged CHANGELOG.md at $tag_sha."
          else
            echo "$TAG release page already matches tagged CHANGELOG.md."
          fi

  android-versioned-release:
    name: build and publish versioned Android release
    if: >-
      github.ref_type == 'tag' ||
      (github.ref == 'refs/heads/master' &&
       needs.validate-version-context.outputs.release_ready == 'true' &&
       needs.validate-version-context.outputs.publish_needed == 'true')
    needs:
      - validate-version-context
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: versioned-release-${{ needs.validate-version-context.outputs.tag }}
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Wait for exact-source CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 180); do
            run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=10")"
            status="$(printf '%s' "$run_json" | python -c 'import json,sys; runs=json.load(sys.stdin)["workflow_runs"]; print(runs[0]["status"] if runs else "")')"
            conclusion="$(printf '%s' "$run_json" | python -c 'import json,sys; runs=json.load(sys.stdin)["workflow_runs"]; print((runs[0]["conclusion"] or "") if runs else "")')"
            url="$(printf '%s' "$run_json" | python -c 'import json,sys; runs=json.load(sys.stdin)["workflow_runs"]; print(runs[0]["html_url"] if runs else "")')"

            if [[ "$status" == "completed" ]]; then
              if [[ "$conclusion" != "success" ]]; then
                echo "Exact-source CI did not pass: conclusion=$conclusion url=$url" >&2
                exit 1
              fi
              echo "Exact-source CI passed: $url"
              break
            fi

            if [[ "$attempt" == "180" ]]; then
              echo "Timed out waiting for exact-source CI for $GITHUB_SHA" >&2
              exit 1
            fi
            sleep 20
          done

      - name: Load update-compatible Android signing key
        shell: bash
        env:
          ZARA_ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ZARA_ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ZARA_ANDROID_DEBUG_KEYSTORE_B64" ]]; then
            echo "Zara Android signing secret is unavailable." >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/zara-android-debug.keystore"
          printf '%s' "$ZARA_ANDROID_DEBUG_KEYSTORE_B64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "ZARA_ANDROID_DEBUG_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Run Android release gate
        run: nix develop ./android -c bash scripts/test-android-release.sh

      - name: Materialize canonical release notes
        id: notes
        shell: bash
        env:
          VERSION: ${{ needs.validate-version-context.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          notes="dist/zara-${VERSION}-release-notes.md"
          python scripts/release-changelog.py --version "$VERSION" --output "$notes"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Prepare APK and checksum
        id: artifact
        shell: bash
        env:
          VERSION: ${{ needs.validate-version-context.outputs.version }}
          VERSION_CODE: ${{ needs.validate-version-context.outputs.version_code }}
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="dist/zara-android-${VERSION}.apk"
          code_editor_apk="dist/zara-code-editor-${VERSION}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$apk"
          cp android/code-editor/build/outputs/apk/debug/code-editor-debug.apk "$code_editor_apk"
          sha256sum "$apk" > "${apk}.sha256"
          sha256sum "$code_editor_apk" > "${code_editor_apk}.sha256"
          {
            echo "schema=1"
            echo "source_sha=${GITHUB_SHA}"
            echo "version_name=${VERSION}"
            echo "version_code=${VERSION_CODE}"
            echo "apk=$(basename "$apk")"
            echo "apk_sha256=$(sha256sum "$apk" | awk '{print $1}')"
          } > "dist/zara-android-${VERSION}.manifest.txt"
          {
            echo "schema=1"
            echo "source_sha=${GITHUB_SHA}"
            echo "version_name=${VERSION}"
            echo "version_code=${VERSION_CODE}"
            echo "apk=$(basename "$code_editor_apk")"
            echo "apk_sha256=$(sha256sum "$code_editor_apk" | awk '{print $1}')"
          } > "dist/zara-code-editor-${VERSION}.manifest.txt"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "manifest=dist/zara-android-${VERSION}.manifest.txt" >> "$GITHUB_OUTPUT"
          echo "code_editor_apk=$code_editor_apk" >> "$GITHUB_OUTPUT"
          echo "code_editor_manifest=dist/zara-code-editor-${VERSION}.manifest.txt" >> "$GITHUB_OUTPUT"

      - name: Verify update-compatible Android signing certificates
        env:
          APK: ${{ steps.artifact.outputs.apk }}
          CODE_EDITOR_APK: ${{ steps.artifact.outputs.code_editor_apk }}
        run: |
          nix develop ./android -c bash scripts/check-android-apk-signer.sh "$APK"
          nix develop ./android -c bash scripts/check-android-apk-signer.sh "$CODE_EDITOR_APK"

      - name: Enable KVM access for released-APK acceptance
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android emulator host runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0

      - name: Prime Android emulator SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?ANDROID SDK root is unavailable}}"
          emulator_bin="$sdk_root/emulator/emulator"
          android_cache="${HOME:?HOME is unavailable}/.android/cache"
          android_cli_tools_build="15859902"
          android_cli_tools_sha256="4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583"
          android_cli_tools_archive="commandlinetools-linux-${android_cli_tools_build}_latest.zip"
          android_cli_tools_url="https://dl.google.com/android/repository/${android_cli_tools_archive}"
          android_cli_tools_tmp="$(mktemp -d)"
          trap 'rm -rf "$android_cli_tools_tmp"' EXIT

          curl --fail --location --retry 3 --retry-delay 2             "$android_cli_tools_url"             --output "$android_cli_tools_tmp/$android_cli_tools_archive"
          printf '%s  %s\n'             "$android_cli_tools_sha256"             "$android_cli_tools_tmp/$android_cli_tools_archive"             | sha256sum --check
          unzip -q             "$android_cli_tools_tmp/$android_cli_tools_archive"             -d "$android_cli_tools_tmp/unpacked"

          rm -rf "$sdk_root/cmdline-tools/latest"
          mkdir -p "$sdk_root/cmdline-tools/latest"
          cp -R             "$android_cli_tools_tmp/unpacked/cmdline-tools/."             "$sdk_root/cmdline-tools/latest/"

          sdkmanager_bin="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_bin"

          if test -x "$emulator_bin" && "$emulator_bin" -version; then
            exit 0
          fi

          for attempt in 1 2 3; do
            rm -rf "$sdk_root/emulator" "$sdk_root/.temp" "$sdk_root/.downloadIntermediates" "$android_cache"
            if "$sdkmanager_bin" --sdk_root="$sdk_root" --install platform-tools --channel=0               && "$sdkmanager_bin" --sdk_root="$sdk_root" --install emulator --channel=0               && test -x "$emulator_bin"               && "$emulator_bin" -version; then
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          exit 1

      - name: Exercise exact release APK before publication
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK: ${{ steps.artifact.outputs.apk }}
          SOURCE_SHA: ${{ github.sha }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash -euo pipefail -c 'serial="emulator-5554"; adb -s "$serial" wait-for-device; test "$(adb -s "$serial" get-state)" = "device"; adb -s "$serial" install -r "$APK"; nix develop ./android -c python3 android/integration/device_acceptance.py --serial "$serial" --source-sha "$SOURCE_SHA" --output artifacts/versioned-release-device'

      - name: Upload exact release APK acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: versioned-release-device-${{ github.sha }}
          path: artifacts/versioned-release-device/
          if-no-files-found: error

      - name: Publish GitHub versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-version-context.outputs.tag }}
          VERSION: ${{ needs.validate-version-context.outputs.version }}
          VERSION_CODE: ${{ needs.validate-version-context.outputs.version_code }}
          APK: ${{ steps.artifact.outputs.apk }}
          MANIFEST: ${{ steps.artifact.outputs.manifest }}
          CODE_EDITOR_APK: ${{ steps.artifact.outputs.code_editor_apk }}
          CODE_EDITOR_MANIFEST: ${{ steps.artifact.outputs.code_editor_manifest }}
          NOTES: ${{ steps.notes.outputs.notes }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "${GITHUB_REF_TYPE}" == "branch" ]]; then
              existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq '.sha')"
              if [[ "$existing_sha" != "$GITHUB_SHA" ]]; then
                echo "Release $TAG already exists at $existing_sha; expected promoted source $GITHUB_SHA." >&2
                exit 1
              fi

              assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
              for required in \
                "$(basename "$APK")" \
                "$(basename "${APK}.sha256")" \
                "$(basename "$MANIFEST")" \
                "$(basename "$CODE_EDITOR_APK")" \
                "$(basename "${CODE_EDITOR_APK}.sha256")" \
                "$(basename "$CODE_EDITOR_MANIFEST")" \
                "$(basename "$NOTES")"
              do
                if ! grep -Fxq "$required" <<< "$assets"; then
                  echo "Release $TAG is missing required asset $required." >&2
                  exit 1
                fi
              done

              existing_dir="$RUNNER_TEMP/existing-release-${TAG}"
              mkdir -p "$existing_dir"
              gh release download "$TAG" \
                --dir "$existing_dir" \
                --pattern "$(basename "$MANIFEST")"
              gh release download "$TAG" \
                --dir "$existing_dir" \
                --pattern "$(basename "$CODE_EDITOR_MANIFEST")"
              existing_manifest="$existing_dir/$(basename "$MANIFEST")"
              existing_code_editor_manifest="$existing_dir/$(basename "$CODE_EDITOR_MANIFEST")"
              grep -Fxq "source_sha=${GITHUB_SHA}" "$existing_manifest" || {
                echo "Release $TAG manifest source_sha does not match $GITHUB_SHA." >&2
                exit 1
              }
              grep -Fxq "version_name=${VERSION}" "$existing_manifest" || {
                echo "Release $TAG manifest version_name does not match $VERSION." >&2
                exit 1
              }
              grep -Fxq "version_code=${VERSION_CODE}" "$existing_manifest" || {
                echo "Release $TAG manifest version_code does not match $VERSION_CODE." >&2
                exit 1
              }

              grep -Fxq "source_sha=${GITHUB_SHA}" "$existing_code_editor_manifest" || {
                echo "Release $TAG Code Editor manifest source_sha does not match $GITHUB_SHA." >&2
                exit 1
              }
              grep -Fxq "version_name=${VERSION}" "$existing_code_editor_manifest" || {
                echo "Release $TAG Code Editor manifest version_name does not match $VERSION." >&2
                exit 1
              }
              grep -Fxq "version_code=${VERSION_CODE}" "$existing_code_editor_manifest" || {
                echo "Release $TAG Code Editor manifest version_code does not match $VERSION_CODE." >&2
                exit 1
              }

              existing_notes="$RUNNER_TEMP/existing-release-notes.md"
              gh release view "$TAG" --json body --jq '.body' > "$existing_notes"
              if ! diff -u "$NOTES" "$existing_notes"; then
                echo "Refreshing $TAG release page from canonical CHANGELOG.md."
                gh release edit "$TAG" --notes-file "$NOTES"
              fi

              echo "Release $TAG already exists and matches canonical promotion $GITHUB_SHA."
              exit 0
            fi
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/${TAG}^{commit}" >/dev/null; then
            existing_tag_sha="$(git rev-list -n 1 "$TAG")"
            if [[ "$existing_tag_sha" != "$GITHUB_SHA" ]]; then
              echo "Tag $TAG already exists at $existing_tag_sha; expected release source $GITHUB_SHA." >&2
              exit 1
            fi
          fi

          release_flags=()
          if [[ "$VERSION" == *-* ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create "$TAG" \
            "$APK" \
            "${APK}.sha256" \
            "$MANIFEST" \
            "$CODE_EDITOR_APK" \
            "${CODE_EDITOR_APK}.sha256" \
            "$CODE_EDITOR_MANIFEST" \
            "$NOTES" \
            --target "$GITHUB_SHA" \
            --title "Zara $TAG" \
            --notes-file "$NOTES" \
            "${release_flags[@]}"

      - name: Verify published release bytes, metadata, signer, and notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-version-context.outputs.tag }}
          VERSION: ${{ needs.validate-version-context.outputs.version }}
          VERSION_CODE: ${{ needs.validate-version-context.outputs.version_code }}
          APK: ${{ steps.artifact.outputs.apk }}
          MANIFEST: ${{ steps.artifact.outputs.manifest }}
          CODE_EDITOR_APK: ${{ steps.artifact.outputs.code_editor_apk }}
          CODE_EDITOR_MANIFEST: ${{ steps.artifact.outputs.code_editor_manifest }}
          NOTES: ${{ steps.notes.outputs.notes }}
        shell: bash
        run: |
          set -euo pipefail

          verify_dir="$RUNNER_TEMP/published-${TAG}"
          rm -rf "$verify_dir"
          mkdir -p "$verify_dir"
          gh release download "$TAG" \
            --dir "$verify_dir" \
            --pattern "$(basename "$APK")" \
            --pattern "$(basename "${APK}.sha256")" \
            --pattern "$(basename "$MANIFEST")" \
            --pattern "$(basename "$CODE_EDITOR_APK")" \
            --pattern "$(basename "${CODE_EDITOR_APK}.sha256")" \
            --pattern "$(basename "$CODE_EDITOR_MANIFEST")" \
            --pattern "$(basename "$NOTES")"

          published_apk="$verify_dir/$(basename "$APK")"
          published_checksum="$verify_dir/$(basename "${APK}.sha256")"
          published_manifest="$verify_dir/$(basename "$MANIFEST")"
          published_code_editor_apk="$verify_dir/$(basename "$CODE_EDITOR_APK")"
          published_code_editor_checksum="$verify_dir/$(basename "${CODE_EDITOR_APK}.sha256")"
          published_code_editor_manifest="$verify_dir/$(basename "$CODE_EDITOR_MANIFEST")"
          published_notes="$verify_dir/$(basename "$NOTES")"

          cmp "$APK" "$published_apk"
          cmp "$MANIFEST" "$published_manifest"
          cmp "$CODE_EDITOR_APK" "$published_code_editor_apk"
          cmp "$CODE_EDITOR_MANIFEST" "$published_code_editor_manifest"
          cmp "$NOTES" "$published_notes"

          expected_sha="$(awk '{print $1}' "$published_checksum")"
          actual_sha="$(sha256sum "$published_apk" | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"
          expected_code_editor_sha="$(awk '{print $1}' "$published_code_editor_checksum")"
          actual_code_editor_sha="$(sha256sum "$published_code_editor_apk" | awk '{print $1}')"
          test "$actual_code_editor_sha" = "$expected_code_editor_sha"

          grep -Fxq "source_sha=${GITHUB_SHA}" "$published_manifest"
          grep -Fxq "version_name=${VERSION}" "$published_manifest"
          grep -Fxq "version_code=${VERSION_CODE}" "$published_manifest"
          grep -Fxq "apk=$(basename "$published_apk")" "$published_manifest"
          grep -Fxq "apk_sha256=${actual_sha}" "$published_manifest"
          grep -Fxq "source_sha=${GITHUB_SHA}" "$published_code_editor_manifest"
          grep -Fxq "version_name=${VERSION}" "$published_code_editor_manifest"
          grep -Fxq "version_code=${VERSION_CODE}" "$published_code_editor_manifest"
          grep -Fxq "apk=$(basename "$published_code_editor_apk")" "$published_code_editor_manifest"
          grep -Fxq "apk_sha256=${actual_code_editor_sha}" "$published_code_editor_manifest"

          release_body="$RUNNER_TEMP/published-release-body.md"
          gh release view "$TAG" --json body --jq '.body' > "$release_body"
          diff -u "$NOTES" "$release_body"

          nix develop ./android -c bash scripts/check-android-apk-signer.sh "$published_apk"
          nix develop ./android -c bash scripts/check-android-apk-signer.sh "$published_code_editor_apk"
