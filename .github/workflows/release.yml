name: Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths:
      - android/app/build.gradle.kts
      - android/wear-app/build.gradle.kts
      - android/wear-watchface/build.gradle.kts

permissions:
  contents: write

jobs:
  android-alpha-release:
    name: build and publish Android alpha
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' android/app/build.gradle.kts)"
          if [[ -z "$version" ]]; then
            echo "Could not resolve Android versionName." >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Android versionName is not SemVer: $version" >&2
            exit 1
          fi
          version_code="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' android/app/build.gradle.kts)"
          if [[ -z "$version_code" || "$version_code" -lt 1 ]]; then
            echo "Could not resolve a positive Android versionCode." >&2
            exit 1
          fi

          tag="v${version}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "$tag" ]]; then
            echo "Tag/version mismatch: ref=${GITHUB_REF_NAME}, app=${tag}" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Load update-compatible Android signing key
        shell: bash
        env:
          ZARA_ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ZARA_ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ZARA_ANDROID_DEBUG_KEYSTORE_B64" ]]; then
            echo "Zara Android signing secret is unavailable." >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/zara-android-debug.keystore"
          printf '%s' "$ZARA_ANDROID_DEBUG_KEYSTORE_B64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "ZARA_ANDROID_DEBUG_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Run Android release gate
        run: nix develop ./android -c bash scripts/test-android-release.sh

      - name: Prepare APKs and checksums
        id: artifact
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
        run: |
          set -euo pipefail
          mkdir -p dist
          phone_apk="dist/zara-android-${VERSION}.apk"
          wear_apk="dist/zara-wear-${VERSION}.apk"
          agenda_apk="dist/zara-agenda-${VERSION}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$phone_apk"
          cp android/wear-app/build/outputs/apk/debug/wear-app-debug.apk "$wear_apk"
          cp android/wear-watchface/build/outputs/apk/debug/wear-watchface-debug.apk "$agenda_apk"
          sha256sum "$phone_apk" > "${phone_apk}.sha256"
          sha256sum "$wear_apk" > "${wear_apk}.sha256"
          sha256sum "$agenda_apk" > "${agenda_apk}.sha256"
          {
            echo "schema=2"
            echo "source_sha=${GITHUB_SHA}"
            echo "version_name=${VERSION}"
            echo "version_code=${VERSION_CODE}"
            echo "phone_apk=$(basename "$phone_apk")"
            echo "phone_sha256=$(sha256sum "$phone_apk" | awk '{print $1}')"
            echo "wear_apk=$(basename "$wear_apk")"
            echo "wear_sha256=$(sha256sum "$wear_apk" | awk '{print $1}')"
            echo "agenda_apk=$(basename "$agenda_apk")"
            echo "agenda_sha256=$(sha256sum "$agenda_apk" | awk '{print $1}')"
          } > "dist/zara-android-${VERSION}.manifest.txt"
          echo "phone_apk=$phone_apk" >> "$GITHUB_OUTPUT"
          echo "wear_apk=$wear_apk" >> "$GITHUB_OUTPUT"
          echo "agenda_apk=$agenda_apk" >> "$GITHUB_OUTPUT"
          echo "manifest=dist/zara-android-${VERSION}.manifest.txt" >> "$GITHUB_OUTPUT"

      - name: Verify update-compatible Android signing certificates
        env:
          PHONE_APK: ${{ steps.artifact.outputs.phone_apk }}
          WEAR_APK: ${{ steps.artifact.outputs.wear_apk }}
          AGENDA_APK: ${{ steps.artifact.outputs.agenda_apk }}
        run: |
          nix develop ./android -c bash scripts/check-android-apk-signer.sh "$PHONE_APK"
          nix develop ./android -c bash scripts/check-android-apk-signer.sh "$WEAR_APK"
          nix develop ./android -c bash scripts/check-android-apk-signer.sh "$AGENDA_APK"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          PHONE_APK: ${{ steps.artifact.outputs.phone_apk }}
          WEAR_APK: ${{ steps.artifact.outputs.wear_apk }}
          AGENDA_APK: ${{ steps.artifact.outputs.agenda_apk }}
          MANIFEST: ${{ steps.artifact.outputs.manifest }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi

          gh release create "$TAG" \
            "$PHONE_APK" "${PHONE_APK}.sha256" \
            "$WEAR_APK" "${WEAR_APK}.sha256" \
            "$AGENDA_APK" "${AGENDA_APK}.sha256" \
            "$MANIFEST" \
            --target "$GITHUB_SHA" \
            --title "Zara $TAG" \
            --prerelease \
            --notes "Android alpha preview of Zara, Zara Wear, and the Zara Agenda watch face. These are debug-signed APKs intended for direct sideloading/testing. Verify each APK with its SHA-256 file. Source commit: $GITHUB_SHA"
