name: Emacs Conversation

on:
  pull_request:
    paths:
      - "emacs/zara.el"
      - "emacs/zara-conversation.el"
      - "emacs/zara-conversation-symbolic.el"
      - "emacs/zara-conversation-test.el"
      - "emacs/zara-conversation-recovery-test.el"
      - "emacs/zara-conversation-strict-test.el"
      - "emacs/zara-conversation-context-test.el"
      - "emacs/zara-conversation-replay-test.el"
      - "emacs/zara-conversation-symbolic-replay-test.el"
      - "emacs/zara-conversation-symbolic-inspect-test.el"
      - "emacs/zara-conversation-unified-replay-test.el"
      - "emacs/zara-conversation-cancel-replay-test.el"
      - ".github/workflows/emacs-conversation.yml"
  push:
    branches:
      - master
    paths:
      - "emacs/zara.el"
      - "emacs/zara-conversation.el"
      - "emacs/zara-conversation-symbolic.el"
      - "emacs/zara-conversation-test.el"
      - "emacs/zara-conversation-recovery-test.el"
      - "emacs/zara-conversation-strict-test.el"
      - "emacs/zara-conversation-context-test.el"
      - "emacs/zara-conversation-replay-test.el"
      - "emacs/zara-conversation-symbolic-replay-test.el"
      - "emacs/zara-conversation-symbolic-inspect-test.el"
      - "emacs/zara-conversation-unified-replay-test.el"
      - "emacs/zara-conversation-cancel-replay-test.el"
      - ".github/workflows/emacs-conversation.yml"

permissions:
  contents: read

jobs:
  ert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Emacs
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends emacs-nox
      - name: Run canonical conversation ERT
        run: |
          set -euo pipefail
          emacs -Q --batch \
            -L emacs \
            -l emacs/zara-conversation-strict-test.el \
            -l emacs/zara-conversation-context-test.el \
            -l emacs/zara-conversation-replay-test.el \
            -l emacs/zara-conversation-symbolic-replay-test.el \
            -l emacs/zara-conversation-symbolic-inspect-test.el \
            -l emacs/zara-conversation-unified-replay-test.el \
            -l emacs/zara-conversation-cancel-replay-test.el \
            -f ert-run-tests-batch-and-exit
