name: Android output policy
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: android-policy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-policy:
    name: native policy / SWI + Trealla + JNI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Require real native policy execution
        run: nix develop ./android -c bash scripts/test-android-policy.sh
      - name: Upload policy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-policy-diagnostics
          path: android/app/build/reports/policy-parity/
          if-no-files-found: error
